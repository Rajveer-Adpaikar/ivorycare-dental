<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — IvoryCare Dental &amp; Implant Centre</title>
    <script>
      // GitHub Pages SPA fallback: remember the requested path, then boot the
      // app. index.html restores the path via sessionStorage.redirect so the
      // router can render the right page (or the React 404 for bad URLs).
      sessionStorage.redirect = location.pathname + location.search;
      location.replace('/ivorycare-dental/');
    </script>
  </head>
  <body></body>
</html>
